# autousb.conf

ENABLED=1
DAEMON=1

# 1=锁定 LOCK_PROFILE，被改就改回；0=插入时套一次 ON_CONNECT
LOCK_ENABLED=0
# none|mtp|ptp|rndis|midi，adb 由 ADB_ON_CONNECT 拼
LOCK_PROFILE=mtp

ON_CONNECT=mtp

# keep=不动 | restore=回到 OFF_PROFILE | none=清空
ON_DISCONNECT=keep
OFF_PROFILE=mtp

# 写 persist.sys.usb.config，开机框架自管
PERSIST=1

# keep|1|0。1 = 插线即开 adb，锁屏也生效（不需要解锁确认）
ADB_ON_CONNECT=1
ADB_ON_DISCONNECT=keep

# ro.adb.secure=0，任意主机免指纹确认。重启生效
INSECURE_ADB=1

# auto=系统在用才写 vendor.usb.config；force=总是写
VENDOR_MODE=auto

POLL_INTERVAL=1
DEBOUNCE=2

# 0=关 1=状态变化 2=详细
LOG_LEVEL=1
LOG_MAX_KB=256
